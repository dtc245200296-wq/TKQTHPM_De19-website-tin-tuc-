events { worker_connections 1024; }
http {
    include mime.types;
    server_tokens off;

    server {
        listen 80;
        location / {
            proxy_pass http://wordpress:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /phpmyadmin/ {
            proxy_pass http://phpmyadmin:80/;
            proxy_set_header Host $host;
        }
    }
}
